<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14534a"/>
      <stop offset="100%" stop-color="#0a3832"/>
    </linearGradient>
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#052e28" flood-opacity="0.35"/>
    </filter>
  </defs>
  
  <!-- Outer Circular Badge -->
  <circle cx="50" cy="50" r="46" fill="url(#badgeGrad)" filter="url(#badgeShadow)"/>
  <circle cx="50" cy="50" r="45" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
  
  <!-- Constellation / Mountain Node 'N' Structure -->
  <!-- Connecting Lines -->
  <line x1="32" y1="30" x2="32" y2="70" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
  <line x1="32" y1="30" x2="68" y2="70" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
  <line x1="68" y1="30" x2="68" y2="70" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Golden Node Vertices -->
  <circle cx="32" cy="30" r="4.5" fill="#f59e0b" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="32" cy="70" r="4.5" fill="#f59e0b" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="68" cy="30" r="4.5" fill="#f59e0b" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="68" cy="70" r="4.5" fill="#f59e0b" stroke="#ffffff" stroke-width="1.5"/>
</svg>

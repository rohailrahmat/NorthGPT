<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account &mdash; NorthGPT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0a0a0f;
    --surface: rgba(255,255,255,0.04);
    --border: rgba(255,255,255,0.08);
    --text: #f0f0f0;
    --muted: #888;
    --accent: #3b82f6;
    --accent-glow: rgba(59,130,246,0.25);
  }
  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text);
    position: relative;
    overflow: hidden;
  }
  body::before, body::after {
    content: '';
    position: fixed;
    border-radius: 50%;
    filter: blur(100px);
    opacity: 0.15;
    pointer-events: none;
  }
  body::before { width: 500px; height: 500px; background: #3b82f6; top: -150px; left: -150px; }
  body::after  { width: 400px; height: 400px; background: #8b5cf6; bottom: -100px; right: -100px; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    backdrop-filter: blur(20px);
    border-radius: 20px;
    padding: 44px 40px;
    width: 100%;
    max-width: 440px;
    position: relative;
    z-index: 1;
  }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 28px; justify-content: center; }
  .brand img { height: 32px; }
  .brand-name { font-size: 1.3rem; font-weight: 700; letter-spacing: -0.5px; }
  h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.5px; text-align: center; margin-bottom: 4px; }
  .subtitle { text-align: center; color: var(--muted); font-size: 0.875rem; margin-bottom: 26px; }

  .error-banner {
    background: rgba(239,68,68,0.1);
    border: 1px solid rgba(239,68,68,0.3);
    color: #fca5a5;
    border-radius: 10px;
    padding: 12px 16px;
    font-size: 0.875rem;
    margin-bottom: 18px;
  }

  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .field { margin-bottom: 16px; }
  label { display: block; font-size: 0.78rem; font-weight: 500; color: var(--muted); text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 6px; }
  input {
    width: 100%;
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 11px 14px;
    font-size: 0.88rem;
    font-family: inherit;
    color: var(--text);
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
  input::placeholder { color: #555; }

  .hint { font-size: 0.75rem; color: #666; margin-top: 4px; }

  .btn {
    width: 100%;
    padding: 14px;
    background: var(--accent);
    color: #fff;
    font-size: 0.95rem;
    font-weight: 600;
    font-family: inherit;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    margin-top: 6px;
    transition: opacity 0.2s, box-shadow 0.2s, transform 0.15s;
    box-shadow: 0 4px 20px var(--accent-glow);
  }
  .btn:hover { opacity: 0.9; box-shadow: 0 6px 28px var(--accent-glow); transform: translateY(-1px); }
  .btn:active { transform: translateY(0); }

  .terms { font-size: 0.78rem; color: var(--muted); text-align: center; margin-top: 14px; line-height: 1.5; }
  .terms a { color: var(--accent); text-decoration: none; }
  .divider { display: flex; align-items: center; gap: 12px; margin: 18px 0; color: var(--muted); font-size: 0.8rem; }
  .divider::before, .divider::after { content: ''; flex: 1; border-top: 1px solid var(--border); }
  .footer-link { text-align: center; font-size: 0.875rem; color: var(--muted); }
  .footer-link a { color: var(--accent); text-decoration: none; font-weight: 500; }
</style>
</head>
<body>
<div class="card">
  <div class="brand">
    <img src="/static/logo.svg" alt="NorthGPT">
    <span class="brand-name">NorthGPT</span>
  </div>
  <h1>Create your account</h1>
  <p class="subtitle">Start planning your mountain adventure</p>

  {% if error %}
  <div class="error-banner">{{ error }}</div>
  {% endif %}

  <form method="POST" action="/register" autocomplete="on">
    <div class="row">
      <div class="field">
        <label for="name">Full name</label>
        <input type="text" id="name" name="name" placeholder="Ali Khan"
               value="{{ name or '' }}" required autocomplete="name">
      </div>
      <div class="field">
        <label for="phone">Phone (optional)</label>
        <input type="tel" id="phone" name="phone" placeholder="+92 300..."
               value="{{ phone or '' }}" autocomplete="tel">
      </div>
    </div>
    <div class="field">
      <label for="email">Email address</label>
      <input type="email" id="email" name="email" placeholder="you@example.com"
             value="{{ email or '' }}" required autocomplete="email">
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" placeholder="At least 6 characters"
             required autocomplete="new-password" minlength="6">
      <p class="hint">Minimum 6 characters</p>
    </div>
    <button type="submit" class="btn">Create account</button>
    <p class="terms">By signing up you agree to our <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a></p>
  </form>

  <div class="divider">or</div>
  <div class="footer-link">
    Already have an account? <a href="/login">Sign in</a>
  </div>
</div>
</body>
</html>
